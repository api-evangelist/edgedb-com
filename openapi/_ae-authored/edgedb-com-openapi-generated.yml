components:
  schemas:
    PostApiBooksRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        year:
          type: integer
        genre:
          type: string
        read_date:
          type: string
          format: date
    GetBranchMainGraphqlResponse:
      type: object
      properties:
        data:
          type: object
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    PostBranchMainGraphqlRequest:
      type: object
      properties:
        query:
          type: string
        variables:
          type: object
          properties:
            title:
              type: string
            __globals__:
              type: object
              properties:
                default::current_user:
                  type: string
    PostBranchMainGraphqlResponse:
      type: object
      properties:
        data:
          type: object
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    PostSearchRequest:
      type: object
      properties:
        query:
          type: string
    GetUvInstallShResponse:
      type: object
      properties:
        message:
          type: string
